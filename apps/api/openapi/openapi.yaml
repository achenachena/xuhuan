        - { $ref: "#/components/schemas/ChooseShowOptionCommand" }
        - { $ref: "#/components/schemas/ChooseIntermissionReplyCommand" }
        - { $ref: "#/components/schemas/AbandonRunCommand" }
      discriminator:
        propertyName: type
        mapping:
          complete_segment: "#/components/schemas/CompleteSegmentCommand"
          choose_show_option: "#/components/schemas/ChooseShowOptionCommand"
          choose_intermission_reply: "#/components/schemas/ChooseIntermissionReplyCommand"
          abandon_run: "#/components/schemas/AbandonRunCommand"
    RunCommandResponse:
      type: object
      additionalProperties: false
      required: [run, events]
      properties:
        run: { $ref: "#/components/schemas/GameRun" }
        events: { type: array, items: { $ref: "#/components/schemas/RunEvent" } }
    StoryChoiceRequest:
      type: object
      additionalProperties: false
      required: [scene_slug, option_slug, expected_version]
      properties:
        scene_slug: { $ref: "#/components/schemas/Slug" }
        option_slug: { $ref: "#/components/schemas/Slug" }
        expected_version: { type: integer, format: int64, minimum: 1 }
    StoryChoiceResponse:
      type: object
      additionalProperties: false
      required: [progress]
      properties:
        progress: { $ref: "#/components/schemas/GameProgress" }
