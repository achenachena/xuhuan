        protocol: { type: string, const: shooter-v1 }
        content_version: { type: string, const: v4 }
        progress: { $ref: "#/components/schemas/GameProgress" }
        campaign_run: { oneOf: [{ $ref: "#/components/schemas/GameRun" }, { type: "null" }] }
        daily_run: { oneOf: [{ $ref: "#/components/schemas/GameRun" }, { type: "null" }] }
        daily_result: { oneOf: [{ $ref: "#/components/schemas/DailyResult" }, { type: "null" }] }
