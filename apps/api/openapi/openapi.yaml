      type: object
      additionalProperties: false
      required: [type, expected_version, segment_outcome]
      properties:
        type: { type: string, const: complete_segment }
        expected_version: { type: integer, format: int64, minimum: 1 }
        segment_outcome: { $ref: "#/components/schemas/SegmentOutcome" }
    ChooseShowOptionCommand:
      type: object
      additionalProperties: false
      required: [type, expected_version, option_id]
      properties:
        type: { type: string, const: choose_show_option }
        expected_version: { type: integer, format: int64, minimum: 1 }
        option_id: { $ref: "#/components/schemas/Slug" }
    ChooseIntermissionReplyCommand:
      type: object
      additionalProperties: false
      required: [type, expected_version, scene_id, option_id]
      properties:
        type: { type: string, const: choose_intermission_reply }
        expected_version: { type: integer, format: int64, minimum: 1 }
        scene_id: { $ref: "#/components/schemas/Slug" }
        option_id: { $ref: "#/components/schemas/Slug" }
