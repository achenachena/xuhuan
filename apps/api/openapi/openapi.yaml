openapi: 3.1.0
info:
  title: Xuhuan Game API
  version: 1.0.0
  summary: Server-authoritative API for the Xuhuan Telegram Mini App
  description: >-
    The API owns player identity, battle state, randomness, progression, and rewards.
    DevelopmentAuth is accepted only by an explicitly enabled development process and
    is never available in production.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.example.com
    description: Production placeholder
tags:
  - name: Platform
  - name: Player
  - name: Catalog
  - name: Battle
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [Platform]
      summary: Process liveness
      security: []
      responses:
        "200":
          description: Process is alive
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadiness
      tags: [Platform]
      summary: Required dependency readiness
      security: []
      responses:
        "200":
          description: API is ready to serve traffic
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/player:
    get:
      operationId: getPlayer
      tags: [Player]
      summary: Get or create the authenticated player
      security:
        - TelegramInitData: []
        - DevelopmentAuth: []
      responses:
        "200":
          description: Current player profile
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/characters:
    get:
      operationId: listCharacters
      tags: [Catalog]
      summary: List playable characters
      security: []
      responses:
        "200":
          description: Active character catalog
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [characters]
                properties:
                  characters:
                    type: array
                    items:
                      $ref: "#/components/schemas/Character"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/characters/{slug}:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getCharacter
      tags: [Catalog]
      summary: Get one playable character
      security: []
      responses:
        "200":
          description: Character detail
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/encounters:
    get:
      operationId: listEncounters
      tags: [Catalog]
      summary: List active encounters
      security: []
      responses:
        "200":
          description: Active encounter catalog
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [encounters]
                properties:
                  encounters:
                    type: array
                    items:
                      $ref: "#/components/schemas/Encounter"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/encounters/{slug}:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getEncounter
      tags: [Catalog]
      summary: Get one active encounter
      security: []
      responses:
        "200":
          description: Encounter detail
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Encounter"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/battles:
    post:
      operationId: createBattle
      tags: [Battle]
      summary: Create a server-seeded battle and debit its energy cost
      security:
        - TelegramInitData: []
        - DevelopmentAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBattleRequest"
      responses:
        "201":
          description: Battle created
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Battle"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/battles/{id}:
    parameters:
      - $ref: "#/components/parameters/BattleID"
    get:
      operationId: getBattle
      tags: [Battle]
      summary: Get the player's authoritative battle state
      security:
        - TelegramInitData: []
        - DevelopmentAuth: []
      responses:
        "200":
          description: Current battle state
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Battle"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/battles/{id}/actions:
    parameters:
      - $ref: "#/components/parameters/BattleID"
    post:
      operationId: createBattleAction
      tags: [Battle]
      summary: Apply one authoritative, versioned battle action
      security:
        - TelegramInitData: []
        - DevelopmentAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BattleActionRequest"
      responses:
        "200":
          description: Action result and resulting battle
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleActionResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    TelegramInitData:
      type: apiKey
      in: header
      name: X-Telegram-Init-Data
      description: Raw, unmodified Telegram Mini App initData
    DevelopmentAuth:
      type: apiKey
      in: header
      name: X-Dev-Auth
      description: Explicit local token; impossible to enable when APP_ENV is production
  headers:
    RequestID:
      description: Correlation ID generated or accepted by the API
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IdempotencyReplayed:
      description: True when the exact stored response was replayed
      schema:
        type: boolean
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        minLength: 1
        maxLength: 64
    BattleID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique per player and operation; reuse replays the original response
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
  responses:
    InvalidRequest:
      description: Request validation failed
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: invalid_request
              message: The request is invalid
              request_id: 01J4Z6PQZ91GF4G74AM2R3PE8W
    Unauthorized:
      description: Authentication is missing, invalid, malformed, or stale
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: unauthorized
              message: Authentication is required
              request_id: 01J4Z6PQZ91GF4G74AM2R3PE8W
    NotFound:
      description: Resource is absent or not owned by the authenticated player
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: not_found
              message: The requested resource was not found
              request_id: 01J4Z6PQZ91GF4G74AM2R3PE8W
    Conflict:
      description: Expected version, battle state, energy, or idempotency payload conflict
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: version_conflict
              message: The battle state has changed
              request_id: 01J4Z6PQZ91GF4G74AM2R3PE8W
    PayloadTooLarge:
      description: Request body exceeds the configured limit
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnsupportedMediaType:
      description: JSON endpoint did not receive application/json
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Per-player or per-IP rate limit exceeded
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: Unexpected internal failure
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: Required dependency is not ready
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          const: ok
        version:
          type: string
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          const: ready
        checks:
          type: object
          additionalProperties: false
          required: [postgres]
          properties:
            postgres:
              const: ready
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              pattern: "^[a-z][a-z0-9_]*$"
            message:
              type: string
              minLength: 1
            request_id:
              type: string
              minLength: 1
    Player:
      type: object
      additionalProperties: false
      required: [id, telegram_user_id, username, display_name, level, experience, credits, energy, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        telegram_user_id:
          type: string
          pattern: "^[0-9]+$"
          description: String encoding avoids JavaScript integer precision loss
        username:
          type: [string, "null"]
        display_name:
          type: string
        level:
          type: integer
          minimum: 1
        experience:
          type: integer
          minimum: 0
        credits:
          type: integer
          minimum: 0
        energy:
          type: integer
          minimum: 0
          maximum: 180
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Character:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - name
        - biography
        - archetype
        - base_health
        - base_attack
        - base_defense
        - base_speed
        - base_crit_rate
        - base_crit_damage
        - special_move_name
        - special_move_description
        - special_move_type
        - rarity
        - color_theme
        - portrait_url
        - model_url
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        biography:
          type: string
        archetype:
          type: string
        base_health:
          type: integer
          minimum: 1
        base_attack:
          type: integer
          minimum: 1
        base_defense:
          type: integer
          minimum: 0
        base_speed:
          type: integer
          minimum: 1
        base_crit_rate:
          type: number
          minimum: 0
          maximum: 1
        base_crit_damage:
          type: number
          minimum: 0
        special_move_name:
          type: string
        special_move_description:
          type: string
        special_move_type:
          type: string
        rarity:
          type: string
          enum: [common, rare, epic, legendary]
        color_theme:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        portrait_url:
          type: string
          format: uri
        model_url:
          type: string
          format: uri
    Encounter:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - name
        - description
        - level
        - max_health
        - attack
        - defense
        - speed
        - crit_rate
        - crit_damage
        - special_move_name
        - special_move_description
        - color_theme
        - image_url
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        level:
          type: integer
          minimum: 1
        max_health:
          type: integer
          minimum: 1
        attack:
          type: integer
          minimum: 1
        defense:
          type: integer
          minimum: 0
        speed:
          type: integer
          minimum: 1
        crit_rate:
          type: number
          minimum: 0
          maximum: 1
        crit_damage:
          type: number
          minimum: 0
        special_move_name:
          type: string
        special_move_description:
          type: string
        color_theme:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        image_url:
          type: [string, "null"]
          format: uri
    CreateBattleRequest:
      type: object
      additionalProperties: false
      required: [character_slug, encounter_slug]
      properties:
        character_slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 64
        encounter_slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 64
    BattleActionRequest:
      type: object
      additionalProperties: false
      required: [action, expected_version]
      properties:
        action:
          $ref: "#/components/schemas/ActionKind"
        expected_version:
          type: integer
          minimum: 1
    ActionKind:
      type: string
      enum: [light_attack, heavy_attack, special_move, block, counter]
    BattleStatus:
      type: string
      enum: [active, completed, cancelled]
    BattleOutcome:
      type: [string, "null"]
      enum: [victory, defeat, null]
    CombatantState:
      type: object
      additionalProperties: false
      required:
        - slug
        - name
        - level
        - max_health
        - current_health
        - attack
        - defense
        - speed
        - crit_rate
        - crit_damage
        - special_meter
        - combo_count
        - is_blocking
      properties:
        slug:
          type: string
        name:
          type: string
        level:
          type: integer
          minimum: 1
        max_health:
          type: integer
          minimum: 1
        current_health:
          type: integer
          minimum: 0
        attack:
          type: integer
          minimum: 1
        defense:
          type: integer
          minimum: 0
        speed:
          type: integer
          minimum: 1
        crit_rate:
          type: number
          minimum: 0
          maximum: 1
        crit_damage:
          type: number
          minimum: 0
        special_meter:
          type: integer
          minimum: 0
          maximum: 100
        combo_count:
          type: integer
          minimum: 0
        is_blocking:
          type: boolean
    Reward:
      type: object
      additionalProperties: false
      required: [experience, credits, energy]
      properties:
        experience:
          type: integer
          minimum: 0
        credits:
          type: integer
          minimum: 0
        energy:
          type: integer
          maximum: 0
    Battle:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - outcome
        - version
        - turn
        - character
        - encounter
        - hero
        - enemy
        - rewards
        - created_at
        - updated_at
        - completed_at
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/BattleStatus"
        outcome:
          $ref: "#/components/schemas/BattleOutcome"
        version:
          type: integer
          minimum: 1
        turn:
          type: integer
          minimum: 1
        character:
          $ref: "#/components/schemas/Character"
        encounter:
          $ref: "#/components/schemas/Encounter"
        hero:
          $ref: "#/components/schemas/CombatantState"
        enemy:
          $ref: "#/components/schemas/CombatantState"
        rewards:
          oneOf:
            - $ref: "#/components/schemas/Reward"
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
    DamageResult:
      type: object
      additionalProperties: false
      required: [amount, critical, blocked, countered]
      properties:
        amount:
          type: integer
          minimum: 0
        critical:
          type: boolean
        blocked:
          type: boolean
        countered:
          type: boolean
    ActionEvent:
      type: object
      additionalProperties: false
      required: [actor, action, damage, description]
      properties:
        actor:
          type: string
          enum: [hero, enemy]
        action:
          $ref: "#/components/schemas/ActionKind"
        damage:
          oneOf:
            - $ref: "#/components/schemas/DamageResult"
            - type: "null"
        description:
          type: string
    BattleActionResult:
      type: object
      additionalProperties: false
      required: [sequence, events]
      properties:
        sequence:
          type: integer
          minimum: 1
        events:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: "#/components/schemas/ActionEvent"
    BattleActionResponse:
      type: object
      additionalProperties: false
      required: [battle, result]
      properties:
        battle:
          $ref: "#/components/schemas/Battle"
        result:
          $ref: "#/components/schemas/BattleActionResult"
