openapi: 3.1.0
info:
  title: Xuhuan Live Rescue API
  version: 4.0.0
  description: Telegram Mini App API for identity, progression, content, and durable game state.
servers: [{ url: / }]
paths:
  /healthz:
    get:
      operationId: getHealth
      security: []
      responses:
        "200": { description: Healthy, headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
  /readyz:
    get:
      operationId: getReadiness
      security: []
      responses:
        "200": { description: Ready, headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Readiness" } } } }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v2/content/{version}:
    parameters:
      - { name: version, in: path, required: true, schema: { type: string, const: v4 } }
      - { name: locale, in: query, schema: { type: string, enum: [en, zh-CN] } }
    get:
      operationId: getGameContent
      security: []
      responses:
        "200": { description: Immutable localized V4 content, headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" }, ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: "#/components/schemas/GameContent" } } } }
        "304": { description: Cached content is current }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v2/game:
    get:
      operationId: getGameState
      security: [{ TelegramInitData: [] }]
      responses:
        "200": { description: Campaign and daily state, headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }, content: { application/json: { schema: { $ref: "#/components/schemas/GameSnapshot" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v2/runs:
    post:
      operationId: createRun
      security: [{ TelegramInitData: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateRunRequest" } } } }
      responses:
        "201": { description: Created run, headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" }, Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" } }, content: { application/json: { schema: { $ref: "#/components/schemas/GameRun" } } } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v2/runs/{id}:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: getRun
      security: [{ TelegramInitData: [] }]
      responses:
        "200": { description: Authoritative run, headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }, content: { application/json: { schema: { $ref: "#/components/schemas/GameRun" } } } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v2/runs/{id}/commands:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    post:
      operationId: createRunCommand
      security: [{ TelegramInitData: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RunCommandRequest" } } } }
      responses:
        "200": { description: Applied command, headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" }, Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" } }, content: { application/json: { schema: { $ref: "#/components/schemas/RunCommandResponse" } } } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
  /v2/story/choices:
    post:
      operationId: appendStoryChoiceRevision
      security: [{ TelegramInitData: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StoryChoiceRequest" } } } }
      responses:
        "200": { description: Appended story choice revision, headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" }, Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" } }, content: { application/json: { schema: { $ref: "#/components/schemas/StoryChoiceResponse" } } } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v2/daily/results/{id}:
    get:
      operationId: getPublicDailyResult
      security: []
      parameters: [{ $ref: "#/components/parameters/ResourceID" }]
      responses:
        "200": { description: Anonymous daily result referenced by the existing run UUID, headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }, content: { application/json: { schema: { $ref: "#/components/schemas/DailyResult" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    TelegramInitData: { type: apiKey, in: header, name: X-Telegram-Init-Data }
  headers:
    RequestID: { schema: { type: string, minLength: 1, maxLength: 128 } }
    IdempotencyReplayed: { schema: { type: boolean } }
  parameters:
    ResourceID: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128, pattern: "^[A-Za-z0-9._:-]+$" } }
  responses:
    InvalidRequest: { description: Invalid request, headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Unauthorized: { description: Authentication required, headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Forbidden: { description: Content locked, headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    NotFound: { description: Not found, headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Conflict: { description: Version or idempotency conflict, headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    PayloadTooLarge: { description: Payload too large, headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    RateLimited: { description: Too many requests, headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    InternalError: { description: Internal error, headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    ServiceUnavailable: { description: Unavailable, headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  schemas:
    Health: { type: object, additionalProperties: false, required: [status, version], properties: { status: { type: string }, version: { type: string } } }
    Readiness: { type: object, additionalProperties: false, required: [status, checks], properties: { status: { type: string }, checks: { type: object, additionalProperties: { type: string } } } }
    ErrorEnvelope: { type: object, additionalProperties: false, required: [error], properties: { error: { type: object, additionalProperties: false, required: [code, message, request_id], properties: { code: { type: string }, message: { type: string }, request_id: { type: string } } } } }
    Slug:
      type: string
      maxLength: 64
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    AssetPath:
      type: string
      pattern: "^/game/v4/[A-Za-z0-9._/-]+$"
    Rules:
      type: object
      additionalProperties: false
      required: [tick_rate, logical_width, logical_height, player_y, input_columns, starting_hearts, max_enemies, max_enemy_projectiles, max_player_projectiles, max_pickups, max_effects, special_charge_max, graze_charge, waves_per_chapter, boss_stages]
      properties:
        tick_rate: { type: integer, const: 30 }
        logical_width: { type: integer, const: 3600 }
        logical_height: { type: integer, const: 6400 }
        player_y: { type: integer, const: 5200 }
        input_columns: { type: integer, const: 128 }
        starting_hearts: { type: integer, const: 3 }
        max_enemies: { type: integer, const: 14 }
        max_enemy_projectiles: { type: integer, const: 120 }
        max_player_projectiles: { type: integer, const: 48 }
        max_pickups: { type: integer, const: 12 }
        max_effects: { type: integer, const: 24 }
        special_charge_max: { type: integer, const: 100 }
        graze_charge: { type: integer, minimum: 1 }
        waves_per_chapter: { type: integer, const: 3 }
        boss_stages: { type: integer, const: 3 }
    PlayerStats:
      type: object
      additionalProperties: false
      required: [max_health, shot_damage, shot_interval, move_limit]
      properties:
        max_health: { type: integer, const: 3 }
        shot_damage: { type: integer, minimum: 1 }
        shot_interval: { type: integer, minimum: 1 }
        move_limit: { type: integer, minimum: 1 }
    LocalizedSpecial:
      type: object
      additionalProperties: false
      required: [id, name, description, charge_cost, behavior, power, duration_ticks]
      properties:
        id: { $ref: "#/components/schemas/Slug" }
        name: { type: string }
        description: { type: string }
        charge_cost: { type: integer, const: 100 }
        behavior: { type: string, enum: [barrage_break, cheer_guard, afterimage_replay, captain_parry, subtitle_flip, prism_shift, memory_bloom] }
        power: { type: integer, minimum: 1 }
        duration_ticks: { type: integer, minimum: 1 }
    LocalizedShowEffect:
      type: object
      additionalProperties: false
      required: [id, name, description, archetype, behavior, amount]
      properties:
        id: { $ref: "#/components/schemas/Slug" }
        name: { type: string }
        description: { type: string }
        archetype: { type: string, enum: [power, guard, style] }
        behavior: { type: string, enum: [twin_shot, piercing_shot, spread_shot, graze_charge, guard_on_special, pickup_magnet, echo_volley, boss_break, low_health_power, combo_extend, companion_charge, recovery_drop] }
        amount: { type: integer, minimum: 1 }
    LocalizedCharacter:
      type: object
      additionalProperties: false
      required: [id, name, biography, playstyle, color_theme, portrait_url, sprite_url, base_stats, special]
      properties:
        id: { $ref: "#/components/schemas/Slug" }
        name: { type: string }
        biography: { type: string }
        playstyle: { type: string }
        color_theme: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        portrait_url: { $ref: "#/components/schemas/AssetPath" }
        sprite_url: { $ref: "#/components/schemas/AssetPath" }
        base_stats: { $ref: "#/components/schemas/PlayerStats" }
        special: { $ref: "#/components/schemas/LocalizedSpecial" }
    Assist:
      type: object
      additionalProperties: false
      required: [trigger, behavior, amount, cooldown_ticks]
      properties:
        trigger: { type: string, enum: [segment_start, graze_streak, low_health, special_used, boss_stage, pickup_chain, wave_clear] }
        behavior: { type: string, enum: [side_shot, shield, echo_shot, clear_lane, convert_bullet, focus_beam, heal] }
        amount: { type: integer, minimum: 1 }
        cooldown_ticks: { type: integer, minimum: 0 }
    LocalizedCompanion:
      type: object
      additionalProperties: false
      required: [id, character_id, name, description, portrait_url, assist]
      properties:
        id: { $ref: "#/components/schemas/Slug" }
        character_id: { $ref: "#/components/schemas/Slug" }
        name: { type: string }
        description: { type: string }
        portrait_url: { $ref: "#/components/schemas/AssetPath" }
        assist: { $ref: "#/components/schemas/Assist" }
    LocalizedEnemy:
      type: object
      additionalProperties: false
      required: [id, name, description, sprite_url, max_health, speed, contact_damage, move_pattern, shot_pattern, shot_interval, projectile_speed, projectile_damage, telegraph_ticks, traits]
      properties:
        id: { type: string, enum: [spam-bot, clip-cutter, caption-blob, black-screen-ghost, gift-thief, censor-frame] }
        name: { type: string }
        description: { type: string }
        sprite_url: { $ref: "#/components/schemas/AssetPath" }
        max_health: { type: integer, minimum: 1 }
        speed: { type: integer, minimum: 0 }
        contact_damage: { type: integer, minimum: 1 }
        move_pattern: { type: string, enum: [drift, sweep, dive, orbit, anchor, mirror] }
        shot_pattern: { type: string, enum: [aimed, fan, lane, ring, delayed, beam] }
        shot_interval: { type: integer, minimum: 1 }
        projectile_speed: { type: integer, minimum: 1 }
        projectile_damage: { type: integer, minimum: 1 }
        telegraph_ticks: { type: integer, minimum: 0 }
        traits: { type: array, items: { type: string, enum: [shield_link, split, steal_pickup, armor, echo, jammer] } }
    ContentSegment:
      type: object
      additionalProperties: false
      required: [id, duration_ticks, wave_id, background_url, reward_stage]
      properties:
        id: { $ref: "#/components/schemas/Slug" }
        duration_ticks: { type: integer, minimum: 1, maximum: 2700 }
        wave_id: { $ref: "#/components/schemas/Slug" }
        background_url: { $ref: "#/components/schemas/AssetPath" }
        reward_stage: { type: string, enum: [weapon, companion, rescue] }
    Spawn:
      type: object
      additionalProperties: false
      required: [at_tick, enemy_id, count, formation, interval_ticks]
      properties:
        at_tick: { type: integer, minimum: 0 }
        enemy_id: { type: string, enum: [spam-bot, clip-cutter, caption-blob, black-screen-ghost, gift-thief, censor-frame] }
        count: { type: integer, minimum: 1 }
        formation: { type: string, enum: [line, fan, staggered, pincer, center, sweep] }
        interval_ticks: { type: integer, minimum: 0 }
    Wave:
      type: object
      additionalProperties: false
      required: [id, spawns]
      properties:
        id: { $ref: "#/components/schemas/Slug" }
        spawns: { type: array, items: { $ref: "#/components/schemas/Spawn" } }
    ContentBossStage:
      type: object
      additionalProperties: false
      required: [id, health_threshold, move_pattern, shot_pattern, shot_interval, projectile_speed, projectile_damage, telegraph_ticks, special]
      properties:
        id: { $ref: "#/components/schemas/Slug" }
        health_threshold: { type: integer, minimum: 0, maximum: 100 }
        move_pattern: { type: string, enum: [drift, sweep, dive, orbit, anchor, mirror] }
        shot_pattern: { type: string, enum: [aimed, fan, lane, ring, delayed, beam] }
        shot_interval: { type: integer, minimum: 1 }
        projectile_speed: { type: integer, minimum: 1 }
        projectile_damage: { type: integer, minimum: 1 }
        telegraph_ticks: { type: integer, minimum: 0 }
        special: { type: string }
    LocalizedBoss:
      type: object
      additionalProperties: false
      required: [id, name, description, sprite_url, max_health, duration_ticks, stages]
      properties:
        id: { type: string, enum: [optimal-nana, always-on-idol, perfect-highlight, perfect-captain, approved-translation, physical-original, reality-auditor, auto-archive-system] }
        name: { type: string }
        description: { type: string }
        sprite_url: { $ref: "#/components/schemas/AssetPath" }
        max_health: { type: integer, minimum: 1 }
        duration_ticks: { type: integer, minimum: 1, maximum: 2700 }
        stages: { type: array, minItems: 3, maxItems: 3, items: { $ref: "#/components/schemas/ContentBossStage" } }
    LocalizedBubble:
      type: object
      additionalProperties: false
      required: [sender_id, sender, text]
      properties:
        sender_id:
          type: string
          enum: [nana7mi, jiaran, xiangwan, bella, lulu, xingtong, nailu, system, group]
        sender: { type: string }
        text: { type: string }
    LocalizedStoryChoice:
      type: object
      additionalProperties: false
      required: [id, label, result, tag]
      properties:
        id: { $ref: "#/components/schemas/Slug" }
        label: { type: string }
        result: { type: string }
        tag: { $ref: "#/components/schemas/Slug" }
        show_effect_id: { $ref: "#/components/schemas/Slug" }
    LocalizedIntermission:
      type: object
      additionalProperties: false
      required: [after_segment, prompt, messages, choices]
      properties:
        after_segment: { type: integer, minimum: 1, maximum: 3 }
        prompt: { type: string }
        messages: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/LocalizedBubble" } }
        choices: { type: array, minItems: 2, maxItems: 2, items: { $ref: "#/components/schemas/LocalizedStoryChoice" } }
    LocalizedStory:
      type: object
      additionalProperties: false
      required: [prelude, intermission, epilogue, replay_recap]
      properties:
        prelude: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/LocalizedBubble" } }
        intermission: { $ref: "#/components/schemas/LocalizedIntermission" }
        epilogue: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/LocalizedBubble" } }
        replay_recap: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/LocalizedBubble" } }
    LocalizedEncore:
      type: object
      additionalProperties: false
      required: [id, name, description, enemy_speed_percent, projectile_speed_percent, special_charge_penalty_percent]
      properties:
        id: { $ref: "#/components/schemas/Slug" }
        name: { type: string }
        description: { type: string }
        enemy_speed_percent: { type: integer }
        projectile_speed_percent: { type: integer }
        special_charge_penalty_percent: { type: integer, minimum: 0, maximum: 75 }
    LocalizedEnding:
      type: object
      additionalProperties: false
      required: [id, title, summary, messages]
      properties:
        id: { type: string, enum: [open-archive, shared-cut, quiet-signoff] }
        title: { type: string }
        summary: { type: string }
        messages: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/LocalizedBubble" } }
    LocalizedChapter:
      type: object
      additionalProperties: false
      required: [id, order, title, subtitle, featured_character, unlock_companion, background_url, segments, waves, boss, story, encore, endings]
      properties:
        id: { $ref: "#/components/schemas/Slug" }
        order: { type: integer, minimum: 1, maximum: 8 }
        title: { type: string }
        subtitle: { type: string }
        featured_character: { $ref: "#/components/schemas/Slug" }
        unlock_companion: { type: string }
        background_url: { $ref: "#/components/schemas/AssetPath" }
        segments: { type: array, minItems: 3, maxItems: 3, items: { $ref: "#/components/schemas/ContentSegment" } }
        waves: { type: array, minItems: 3, items: { $ref: "#/components/schemas/Wave" } }
        boss: { $ref: "#/components/schemas/LocalizedBoss" }
        story: { $ref: "#/components/schemas/LocalizedStory" }
        encore: { type: array, minItems: 1, maxItems: 3, items: { $ref: "#/components/schemas/LocalizedEncore" } }
        endings: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/LocalizedEnding" } }
    LocalizedDaily:
      type: object
      additionalProperties: false
      required: [id, title, subtitle, seed_timezone, segment_duration_ticks, segment_count, show_choice_count, rotation_characters, wave_ids, boss_ids, encore_modifier_ids]
      properties:
        id: { $ref: "#/components/schemas/Slug" }
        title: { type: string }
        subtitle: { type: string }
        seed_timezone: { type: string, const: UTC }
        segment_duration_ticks: { type: integer, minimum: 1, maximum: 2700 }
        segment_count: { type: integer, const: 2 }
        show_choice_count: { type: integer, const: 1 }
        rotation_characters: { type: array, minItems: 7, maxItems: 7, items: { $ref: "#/components/schemas/Slug" } }
        wave_ids: { type: array, minItems: 1, items: { $ref: "#/components/schemas/Slug" } }
        boss_ids: { type: array, minItems: 1, items: { type: string } }
        encore_modifier_ids: { type: array, items: { $ref: "#/components/schemas/Slug" } }
    GameContent:
      type: object
      additionalProperties: false
      required: [version, protocol, locale, rules, show_effects, characters, companions, enemies, chapters, daily]
      properties:
        version: { type: string, const: v4 }
        protocol: { type: string, const: shooter-v1 }
        locale: { type: string, enum: [en, zh-CN] }
        rules: { $ref: "#/components/schemas/Rules" }
        show_effects: { type: array, minItems: 12, maxItems: 12, items: { $ref: "#/components/schemas/LocalizedShowEffect" } }
        characters: { type: array, minItems: 7, maxItems: 7, items: { $ref: "#/components/schemas/LocalizedCharacter" } }
        companions: { type: array, minItems: 7, maxItems: 7, items: { $ref: "#/components/schemas/LocalizedCompanion" } }
        enemies: { type: array, minItems: 6, maxItems: 6, items: { $ref: "#/components/schemas/LocalizedEnemy" } }
        chapters: { type: array, minItems: 8, maxItems: 8, items: { $ref: "#/components/schemas/LocalizedChapter" } }
        daily: { $ref: "#/components/schemas/LocalizedDaily" }
    Unlock:
      type: object
      additionalProperties: false
      required: [type, content_slug, created_at]
      properties:
        type: { type: string, enum: [character, companion, memory_clip] }
        content_slug: { $ref: "#/components/schemas/Slug" }
        created_at: { type: string, format: date-time }
    StoryChoice:
      type: object
      additionalProperties: false
      required: [scene_slug, option_slug, choice_tag, revision, created_at]
      properties:
        scene_slug: { $ref: "#/components/schemas/Slug" }
        option_slug: { $ref: "#/components/schemas/Slug" }
        choice_tag: { $ref: "#/components/schemas/Slug" }
        revision: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
    ChapterProgress:
      type: object
      additionalProperties: false
      required: [chapter_slug, highest_encore_level, clears, best_score, updated_at]
      properties:
        chapter_slug: { $ref: "#/components/schemas/Slug" }
        highest_encore_level: { type: integer, minimum: 0, maximum: 3 }
        clears: { type: integer, minimum: 0 }
        best_score: { type: integer, minimum: 0 }
        updated_at: { type: string, format: date-time }
    GameProgress:
      type: object
      additionalProperties: false
      required: [current_chapter_slug, story_version, version, unlocks, choices, chapters, ending, daily_unlocked]
      properties:
        current_chapter_slug: { $ref: "#/components/schemas/Slug" }
        story_version: { type: integer, const: 4 }
        version: { type: integer, format: int64, minimum: 1 }
        unlocks: { type: array, items: { $ref: "#/components/schemas/Unlock" } }
        choices: { type: array, items: { $ref: "#/components/schemas/StoryChoice" } }
        chapters: { type: array, items: { $ref: "#/components/schemas/ChapterProgress" } }
        ending: { type: [string, "null"], enum: [open-archive, shared-cut, quiet-signoff, null] }
        daily_unlocked: { type: boolean }
    RuntimeEffect:
      type: object
      additionalProperties: false
      required: [kind, amount]
      properties:
