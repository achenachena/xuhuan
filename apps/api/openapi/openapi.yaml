      type: object
      additionalProperties: false
      required: [mode, chapter_slug, character_slug]
      properties:
        mode: { type: string, const: campaign }
        chapter_slug: { $ref: "#/components/schemas/Slug" }
        character_slug: { $ref: "#/components/schemas/Slug" }
        companion_slug: { $ref: "#/components/schemas/Slug" }
        encore_level: { type: integer, minimum: 0, maximum: 3 }
