      oneOf:
        - { $ref: "#/components/schemas/CampaignCreateRunRequest" }
        - { $ref: "#/components/schemas/DailyCreateRunRequest" }
      discriminator:
        propertyName: mode
        mapping:
          campaign: "#/components/schemas/CampaignCreateRunRequest"
          daily: "#/components/schemas/DailyCreateRunRequest"
