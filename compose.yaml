name: xuhuan

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xuhuan}
      POSTGRES_USER: ${POSTGRES_USER:-xuhuan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_xuhuan_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-xuhuan}:${POSTGRES_PASSWORD:-local_xuhuan_password}@postgres:5432/${POSTGRES_DB:-xuhuan}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/app/seed"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-xuhuan}:${POSTGRES_PASSWORD:-local_xuhuan_password}@postgres:5432/${POSTGRES_DB:-xuhuan}?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-development}
    environment:
      APP_ENV: development
      APP_VERSION: ${APP_VERSION:-development}
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-xuhuan}:${POSTGRES_PASSWORD:-local_xuhuan_password}@postgres:5432/${POSTGRES_DB:-xuhuan}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-150ms}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1m}
      RATE_LIMIT_IP_REQUESTS: ${RATE_LIMIT_IP_REQUESTS:-120}
      RATE_LIMIT_PLAYER_REQUESTS: ${RATE_LIMIT_PLAYER_REQUESTS:-60}
      TRUST_PROXY: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DEV_AUTH_ENABLED: "true"
      DEV_AUTH_TOKEN: ${DEV_AUTH_TOKEN:-local-development-token}
      DEV_TELEGRAM_USER_ID: ${DEV_TELEGRAM_USER_ID:-42424242}
      DEV_USERNAME: ${DEV_USERNAME:-local_player}
      DEV_FIRST_NAME: ${DEV_FIRST_NAME:-Local}
      DEV_LAST_NAME: ${DEV_LAST_NAME:-Player}
      DEV_LANGUAGE_CODE: ${DEV_LANGUAGE_CODE:-zh-CN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_AUTH_MAX_AGE: ${TELEGRAM_AUTH_MAX_AGE:-24h}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-xuhuan-api}
      OTEL_EXPORT_INTERVAL: ${OTEL_EXPORT_INTERVAL:-30s}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
