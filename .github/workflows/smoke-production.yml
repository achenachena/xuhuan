name: Smoke Production V2

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: smoke-production-v2
  cancel-in-progress: false

jobs:
  smoke:
    name: Telegram auth to noise unlock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TELEGRAM_TOKEN_PARAMETER: ${{ vars.AWS_TELEGRAM_TOKEN_PARAMETER }}
      SMOKE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Validate non-secret production configuration
        run: |
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "::error::API_BASE_URL must be a production https URL"; exit 1 ;;
          esac
          test -n "$AWS_REGION"
          test -n "$TELEGRAM_TOKEN_PARAMETER"

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: xuhuan-smoke-${{ github.run_id }}

      - name: Run signed production game journey
        working-directory: apps/miniapp
        run: |
          telegram_token=$(aws ssm get-parameter \
            --name "$TELEGRAM_TOKEN_PARAMETER" \
            --with-decryption \
            --query Parameter.Value \
            --output text)
          test -n "$telegram_token"
          test "$telegram_token" != "replace-out-of-band"
          echo "::add-mask::$telegram_token"
          TELEGRAM_BOT_TOKEN="$telegram_token" node scripts/production-smoke.mjs

      - name: Record verified boundaries
        run: |
          {
            echo "### Production V2 smoke passed"
            echo "- Real Telegram Web App HMAC authentication"
            echo "- V2 content and player bootstrap"
            echo "- Prologue choice and idempotent replay"
            echo "- Run creation and authoritative disconnect recovery"
            echo "- Map, combat, rewards, events, rest, and boss clear"
            echo "- Post-boss story choices and noise level 1 unlock"
          } >> "$GITHUB_STEP_SUMMARY"
