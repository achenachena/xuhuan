name: Deploy Mini App

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Existing protected GitHub/Vercel environment
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: deploy-miniapp-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, verify, and deploy Mini App
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.environment }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install and verify workspace
        run: |
          npm ci
          npm run build --workspace @xuhuan/game-types
          npm run check:api-types --workspace @xuhuan/miniapp
          npm run test --workspace @xuhuan/miniapp
          npm run lint --workspace @xuhuan/miniapp
          npm run typecheck --workspace @xuhuan/miniapp

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@57.0.0

      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=${{ inputs.environment == 'production' && 'production' || 'preview' }} --token="$VERCEL_TOKEN"

      - name: Build precompiled deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build ${{ inputs.environment == 'production' && '--prod' || '' }} --token="$VERCEL_TOKEN"

      - name: Deploy immutable staged artifact
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deploy_args=(--prebuilt)
          if [ "${{ inputs.environment }}" = "production" ]; then
            deploy_args+=(--prod --skip-domain)
          fi
          url=$(vercel deploy "${deploy_args[@]}" --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: curl --fail --show-error --silent --retry 6 --retry-delay 5 "$DEPLOYMENT_URL" > /dev/null

      - name: Promote verified production artifact
        if: inputs.environment == 'production'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel promote "$DEPLOYMENT_URL" --yes --token="$VERCEL_TOKEN"

      - name: Deployment summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: echo "Deployed and verified $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
