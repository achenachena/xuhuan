name: Deploy API

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Existing protected GitHub environment
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy immutable API image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.AWS_ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.AWS_ECS_SERVICE }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: xuhuan-${{ github.run_id }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          image="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --build-arg APP_VERSION="$IMAGE_TAG" --tag "$image" .
          docker push "$image"
          echo "uri=$image" >> "$GITHUB_OUTPUT"

      - name: Capture current task definition
        id: previous
        run: |
          task_definition=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)
          test "$task_definition" != "None"
          echo "arn=$task_definition" >> "$GITHUB_OUTPUT"
          aws ecs describe-task-definition \
            --task-definition "$task_definition" \
            --query taskDefinition \
            > "$RUNNER_TEMP/task-definition.json"

      - name: Insert image into task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1.8.5
        with:
          task-definition: ${{ runner.temp }}/task-definition.json
          container-name: api
          image: ${{ steps.image.outputs.uri }}
          environment-variables: |
            APP_VERSION=${{ env.IMAGE_TAG }}

      - name: Register task definition
        id: register
        env:
          TASK_DEFINITION_FILE: ${{ steps.render.outputs.task-definition }}
        run: |
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            "$TASK_DEFINITION_FILE" > "$RUNNER_TEMP/register-task-definition.json"
          task_definition=$(aws ecs register-task-definition \
            --cli-input-json "file://$RUNNER_TEMP/register-task-definition.json" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "arn=$task_definition" >> "$GITHUB_OUTPUT"

      - name: Run database migrations
        env:
          TASK_DEFINITION: ${{ steps.register.outputs.arn }}
        run: |
          network=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].networkConfiguration.awsvpcConfiguration' \
            --output json)
          network_configuration=$(jq -c '{awsvpcConfiguration: .}' <<< "$network")
          overrides='{"containerOverrides":[{"name":"api","command":["/app/migrate"]}]}'
          task=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$TASK_DEFINITION" \
            --network-configuration "$network_configuration" \
            --overrides "$overrides" \
            --query 'tasks[0].taskArn' \
            --output text)
          test "$task" != "None"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$task"
          # shellcheck disable=SC2016
          exit_code=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$task" \
            --query 'tasks[0].containers[?name==`api`].exitCode | [0]' \
            --output text)
          test "$exit_code" = "0"

      - name: Deploy with ECS circuit breaker
        env:
          TASK_DEFINITION: ${{ steps.register.outputs.arn }}
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEFINITION" \
            --force-new-deployment > /dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          deployed_task_definition=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)
          test "$deployed_task_definition" = "$TASK_DEFINITION"

      - name: Post-deployment health and readiness smoke test
        run: |
          version=$(curl --fail --show-error --silent --retry 6 --retry-delay 5 "$API_BASE_URL/healthz" | jq -r .version)
          test "$version" = "$IMAGE_TAG"
          curl --fail --show-error --silent --retry 6 --retry-delay 5 "$API_BASE_URL/readyz" > /dev/null

      - name: Recover previous task definition
        if: failure() && steps.previous.outputs.arn != ''
        env:
          PREVIOUS_TASK_DEFINITION: ${{ steps.previous.outputs.arn }}
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$PREVIOUS_TASK_DEFINITION" \
            --force-new-deployment > /dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
