name: Deploy API

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Existing protected GitHub environment
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy immutable Lambda version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment == 'production' && 'Production' || 'staging' }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      LAMBDA_FUNCTION: ${{ vars.AWS_LAMBDA_FUNCTION }}
      LAMBDA_ALIAS: ${{ vars.AWS_LAMBDA_ALIAS }}
      LAMBDA_RESERVED_CONCURRENCY: ${{ vars.AWS_LAMBDA_RESERVED_CONCURRENCY }}
      RDS_SECRET_ARN: ${{ vars.AWS_RDS_SECRET_ARN }}
      TELEGRAM_TOKEN_PARAMETER: ${{ vars.AWS_TELEGRAM_TOKEN_PARAMETER }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Build arm64 Lambda archive
        working-directory: apps/api
        run: |
          mkdir -p "$RUNNER_TEMP/xuhuan-lambda"
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -tags lambda.norpc \
            -trimpath \
            -ldflags="-s -w" \
            -o "$RUNNER_TEMP/xuhuan-lambda/bootstrap" \
            ./cmd/lambda
          cd "$RUNNER_TEMP/xuhuan-lambda"
          zip -q lambda.zip bootstrap

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: xuhuan-${{ github.run_id }}

      - name: Capture live state
        id: previous
        run: |
          version=$(aws lambda get-alias \
            --function-name "$LAMBDA_FUNCTION" \
            --name "$LAMBDA_ALIAS" \
            --query FunctionVersion \
            --output text)
          test "$version" != "None"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          reserved_concurrency=$(aws lambda get-function-concurrency \
            --function-name "$LAMBDA_FUNCTION" \
            --query ReservedConcurrentExecutions \
            --output text)
          if test "$reserved_concurrency" = "None"; then
            reserved_concurrency="unreserved"
          fi
          echo "reserved_concurrency=$reserved_concurrency" >> "$GITHUB_OUTPUT"

      - name: Update unpublished code and configuration
        run: |
          database_secret=$(aws secretsmanager get-secret-value \
            --secret-id "$RDS_SECRET_ARN" \
            --query SecretString \
            --output text)
          database_user=$(jq -r '.username' <<< "$database_secret")
          database_password=$(jq -r '.password' <<< "$database_secret")
          telegram_token=$(aws ssm get-parameter \
            --name "$TELEGRAM_TOKEN_PARAMETER" \
            --with-decryption \
            --query Parameter.Value \
            --output text)
          test -n "$database_user"
          test -n "$database_password"
          test -n "$telegram_token"
          test "$telegram_token" != "replace-out-of-band"

          current_variables=$(aws lambda get-function-configuration \
            --function-name "$LAMBDA_FUNCTION" \
            --query Environment.Variables \
            --output json)
          jq -n \
            --argjson current "$current_variables" \
            --arg version "$RELEASE_SHA" \
            --arg database_user "$database_user" \
            --arg database_password "$database_password" \
            --arg telegram_token "$telegram_token" \
            '{Variables: ($current + {
              APP_VERSION: $version,
              DATABASE_USER: $database_user,
              DATABASE_PASSWORD: $database_password,
              TELEGRAM_BOT_TOKEN: $telegram_token
            })}' > "$RUNNER_TEMP/lambda-environment.json"
          chmod 600 "$RUNNER_TEMP/lambda-environment.json"

          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION" \
            --zip-file "fileb://$RUNNER_TEMP/xuhuan-lambda/lambda.zip" > /dev/null
          aws lambda wait function-updated-v2 --function-name "$LAMBDA_FUNCTION"
          aws lambda update-function-configuration \
            --function-name "$LAMBDA_FUNCTION" \
            --environment "file://$RUNNER_TEMP/lambda-environment.json" > /dev/null
          aws lambda wait function-updated-v2 --function-name "$LAMBDA_FUNCTION"

      - name: Publish immutable version
        id: release
        run: |
          version=$(aws lambda publish-version \
            --function-name "$LAMBDA_FUNCTION" \
            --description "$RELEASE_SHA" \
            --query Version \
            --output text)
          test "$version" != "None"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Enable bounded concurrency
        run: |
          test "$LAMBDA_RESERVED_CONCURRENCY" -ge 1
          test "$LAMBDA_RESERVED_CONCURRENCY" -le 2
          account_concurrency=$(aws lambda get-account-settings \
            --query AccountLimit.ConcurrentExecutions \
            --output text)
          minimum_unreserved_concurrency=10
          required_account_concurrency=$((LAMBDA_RESERVED_CONCURRENCY + minimum_unreserved_concurrency))

          if test "$account_concurrency" -ge "$required_account_concurrency"; then
            aws lambda put-function-concurrency \
              --function-name "$LAMBDA_FUNCTION" \
              --reserved-concurrent-executions "$LAMBDA_RESERVED_CONCURRENCY" > /dev/null
          else
            aws lambda delete-function-concurrency \
              --function-name "$LAMBDA_FUNCTION"
            echo "::warning::Lambda account concurrency is $account_concurrency; using the account-wide new-account cap until AWS raises it to at least $required_account_concurrency."
          fi

      - name: Migrate and seed PostgreSQL
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          aws lambda invoke \
            --function-name "$LAMBDA_FUNCTION" \
            --qualifier "$RELEASE_VERSION" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"operation":"migrate-and-seed"}' \
            "$RUNNER_TEMP/migration-response.json" \
            > "$RUNNER_TEMP/migration-metadata.json"
          test -z "$(jq -r '.FunctionError // empty' "$RUNNER_TEMP/migration-metadata.json")"
          test "$(jq -r .status "$RUNNER_TEMP/migration-response.json")" = "ok"

      - name: Promote version to live alias
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          aws lambda update-alias \
            --function-name "$LAMBDA_FUNCTION" \
            --name "$LAMBDA_ALIAS" \
            --function-version "$RELEASE_VERSION" \
            --description "$RELEASE_SHA" > /dev/null

      - name: Verify public health and readiness
        run: |
          version=$(curl --fail --show-error --silent --retry 6 --retry-delay 5 "$API_BASE_URL/healthz" | jq -r .version)
          test "$version" = "$RELEASE_SHA"
          curl --fail --show-error --silent --retry 6 --retry-delay 5 "$API_BASE_URL/readyz" > /dev/null

      - name: Restore previous live state
        if: failure() && steps.previous.outputs.version != ''
        env:
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
          PREVIOUS_RESERVED_CONCURRENCY: ${{ steps.previous.outputs.reserved_concurrency }}
        run: |
          aws lambda put-function-concurrency \
            --function-name "$LAMBDA_FUNCTION" \
            --reserved-concurrent-executions 0 > /dev/null
          aws lambda update-alias \
            --function-name "$LAMBDA_FUNCTION" \
            --name "$LAMBDA_ALIAS" \
            --function-version "$PREVIOUS_VERSION" \
            --description "rollback-from-$RELEASE_SHA" > /dev/null
          if test "$PREVIOUS_RESERVED_CONCURRENCY" = "unreserved"; then
            aws lambda delete-function-concurrency \
              --function-name "$LAMBDA_FUNCTION"
          else
            aws lambda put-function-concurrency \
              --function-name "$LAMBDA_FUNCTION" \
              --reserved-concurrent-executions "$PREVIOUS_RESERVED_CONCURRENCY" > /dev/null
          fi
