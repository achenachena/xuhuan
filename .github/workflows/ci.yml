name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.paths.outputs.frontend }}
      backend: ${{ steps.paths.outputs.backend }}
      infrastructure: ${{ steps.paths.outputs.infrastructure }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Select affected checks
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
          # CI changes exercise every job. API release-only edits need backend checks.
          for area in frontend backend infrastructure; do
            case "$area" in
              frontend) pattern='^(apps/miniapp/|apps/api/|package(-lock)?\.json$|scripts/|\.github/workflows/ci\.yml$)' ;;
              backend) pattern='^(apps/api/|apps/miniapp/public/(campaign/|game/v4/demo/)|scripts/build-browser-campaign\.mjs$|\.github/workflows/)' ;;
              infrastructure) pattern='^(infra/|\.github/workflows/ci\.yml$)' ;;
            esac
            if grep -Eq "$pattern" "$RUNNER_TEMP/changed-paths"; then
              echo "$area=true" >> "$GITHUB_OUTPUT"
            else
              echo "$area=false" >> "$GITHUB_OUTPUT"
            fi
          done

  infrastructure:
    needs: changes
    if: needs.changes.outputs.infrastructure == 'true'
    name: Terraform format and schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
      - name: Verify Terraform formatting
        run: terraform fmt -check -recursive
      - name: Initialize providers without a state backend
        run: terraform init -backend=false
      - name: Validate provider schema
        run: terraform validate

  go-quality:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    name: Go format, vet, test, and contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: xuhuan_test
          POSTGRES_USER: xuhuan
          POSTGRES_PASSWORD: xuhuan_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xuhuan -d xuhuan_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      TEST_DATABASE_URL: postgres://xuhuan:xuhuan_test_password@127.0.0.1:5432/xuhuan_test?sslmode=disable
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Unit, integration, and OpenAPI contract tests
        run: go test -vet=all ./...
      - name: Verify generated browser demo manifests
        run: go run ./cmd/export-portfolio-demo --check ../miniapp/public/game/v4/demo
      - name: Verify shared browser campaign build
        working-directory: .
        run: node scripts/build-browser-campaign.mjs --check
      - name: Scan Go call graph for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: Frontend contract, test, lint, type, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_CHANNEL: chrome
      NEXT_PUBLIC_API_URL: https://api.xuhuan.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify content assets
        run: npm run check:content-assets
      - name: Verify generated OpenAPI types
        run: npm run check:api-types --workspace @xuhuan/miniapp
      - name: Frontend tests
        run: npm run test --workspace @xuhuan/miniapp
      - name: Frontend lint
        run: npm run lint --workspace @xuhuan/miniapp
      - name: Frontend production build
        run: npm run build --workspace @xuhuan/miniapp

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=critical
      - name: Run core browser journeys against the production build
        run: npm run test:e2e --workspace @xuhuan/miniapp
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-results
          path: apps/miniapp/test-results
          if-no-files-found: ignore
