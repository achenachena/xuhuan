name: Release production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full commit SHA at the current main HEAD
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: Production
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      LAMBDA_FUNCTION: ${{ vars.AWS_LAMBDA_FUNCTION }}
      LAMBDA_ALIAS: ${{ vars.AWS_LAMBDA_ALIAS }}
      DATABASE_URL_PARAMETER: ${{ vars.AWS_DATABASE_URL_PARAMETER }}
      REDIS_URL_PARAMETER: ${{ vars.AWS_REDIS_URL_PARAMETER }}
      TELEGRAM_TOKEN_PARAMETER: ${{ vars.AWS_TELEGRAM_TOKEN_PARAMETER }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Validate release commit
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Verify current main HEAD
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - name: Build release artifacts
        run: |
          npm ci
          mkdir -p "$RUNNER_TEMP/xuhuan-lambda"
          cd apps/api
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -tags lambda.norpc -trimpath -ldflags="-s -w" \
            -o "$RUNNER_TEMP/xuhuan-lambda/bootstrap" ./cmd/lambda
          cd "$RUNNER_TEMP/xuhuan-lambda"
          zip -q lambda.zip bootstrap

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: xuhuan-release-${{ github.run_id }}

      - name: Publish Lambda version
        id: lambda
        run: |
          umask 077
          database_url=$(aws ssm get-parameter --name "$DATABASE_URL_PARAMETER" --with-decryption --query Parameter.Value --output text)
          redis_url=$(aws ssm get-parameter --name "$REDIS_URL_PARAMETER" --with-decryption --query Parameter.Value --output text)
          telegram_token=$(aws ssm get-parameter --name "$TELEGRAM_TOKEN_PARAMETER" --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$database_url"
          echo "::add-mask::$redis_url"
          echo "::add-mask::$telegram_token"

          current_variables=$(aws lambda get-function-configuration \
            --function-name "$LAMBDA_FUNCTION" \
            --query Environment.Variables --output json)
          jq -n \
            --argjson current "$current_variables" \
            --arg version "$RELEASE_SHA" \
            --arg database_url "$database_url" \
            --arg redis_url "$redis_url" \
            --arg telegram_token "$telegram_token" \
            '{Variables: ($current + {
              APP_ENV: "production",
              APP_VERSION: $version,
              DATABASE_URL: $database_url,
              REDIS_URL: $redis_url,
              REDIS_TIMEOUT: "1s",
              TELEGRAM_BOT_TOKEN: $telegram_token
            })}' > "$RUNNER_TEMP/lambda-environment.json"

          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION" \
            --zip-file "fileb://$RUNNER_TEMP/xuhuan-lambda/lambda.zip" > /dev/null
          aws lambda wait function-updated-v2 --function-name "$LAMBDA_FUNCTION"
          aws lambda update-function-configuration \
            --function-name "$LAMBDA_FUNCTION" \
            --environment "file://$RUNNER_TEMP/lambda-environment.json" > /dev/null
          aws lambda wait function-updated-v2 --function-name "$LAMBDA_FUNCTION"

          version=$(aws lambda publish-version \
            --function-name "$LAMBDA_FUNCTION" \
            --description "$RELEASE_SHA" \
            --query Version --output text)
          aws lambda update-alias \
            --function-name "$LAMBDA_FUNCTION" \
            --name "$LAMBDA_ALIAS" \
            --function-version "$version" \
            --description "$RELEASE_SHA" > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend
        id: vercel
        run: |
          npm install --global vercel@57.0.0
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          test "$(jq -r .projectId .vercel/project.json)" = "$VERCEL_PROJECT_ID"
          test "$(jq -r .orgId .vercel/project.json)" = "$VERCEL_ORG_ID"
          vercel build --prod --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" \
            --meta "releaseSha=$RELEASE_SHA")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Production smoke test
        env:
          FRONTEND_URL: ${{ steps.vercel.outputs.url }}
        run: |
          api=${API_BASE_URL%/}
          test "$(curl --fail --silent --retry 5 "$api/healthz" | jq -r .version)" = "$RELEASE_SHA"
          test "$(curl --fail --silent --retry 5 "$api/readyz" | jq -r .status)" = "ready"
          test "$(curl --fail --silent --retry 5 "$api/v2/content/v4?locale=en" | jq -r .protocol)" = "shooter-v1"
          vercel curl / --deployment "$FRONTEND_URL" -- \
            --fail --silent | grep --fixed-strings --quiet "CONTENT-V4 / SHOOTER-V1"
          vercel curl /demo --deployment "$FRONTEND_URL" -- \
            --fail --silent > /dev/null

      - name: Release summary
        run: |
          {
            echo "### Production release complete"
            echo "- Commit: $RELEASE_SHA"
            echo "- Lambda version: ${{ steps.lambda.outputs.version }}"
            echo "- Vercel deployment: ${{ steps.vercel.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
