name: Promote Staged Mini App

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Verified production-mode Vercel deployment URL from Deploy Mini App
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-miniapp-production
  cancel-in-progress: false

jobs:
  promote:
    name: Promote verified action client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      DEPLOYMENT_URL: ${{ inputs.deployment_url }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@57.0.0

      - name: Validate staged deployment
        run: |
          case "$DEPLOYMENT_URL" in
            https://*.vercel.app) ;;
            *) echo "::error::Expected an HTTPS vercel.app deployment URL"; exit 1 ;;
          esac
          vercel inspect "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > /dev/null
          curl --fail --show-error --silent --retry 6 --retry-delay 5 "$DEPLOYMENT_URL" > /dev/null

      - name: Promote staged deployment
        run: vercel promote "$DEPLOYMENT_URL" --yes --token="$VERCEL_TOKEN"

      - name: Verify promoted application
        run: curl --fail --show-error --silent --retry 6 --retry-delay 5 "$DEPLOYMENT_URL" > /dev/null

      - name: Promotion summary
        run: echo "Promoted the verified action Mini App from $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
